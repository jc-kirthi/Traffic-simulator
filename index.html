<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Bengaluru Traffic Junction Monitor - Web Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CheerpJ 3.0 Loader -->
    <script src="https://cjrt3f.leaningtech.com/3.0/loader.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121214;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f4f4f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #loader {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #4f46e5;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }
        p {
            color: #a0a0aa;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        #container {
            width: 980px;
            height: 780px;
            background-color: #121214;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loader">
        <div class="spinner"></div>
        <h2>Initializing Smart AI Traffic Platform</h2>
        <p>Compiling Java JVM to WebAssembly... (Takes 10-15 seconds on first run)</p>
    </div>

    <!-- Swing GUI Container -->
    <div id="container"></div>

    <script>
        // Initialize CheerpJ
        cheerpjInit().then(() => {
            // Hide loading spinner
            const loader = document.getElementById("loader");
            if (loader) {
                loader.style.opacity = "0";
                setTimeout(() => loader.style.display = "none", 500);
            }
            // Create virtual canvas display
            cheerpjCreateDisplay(980, 780, document.getElementById("container"));
            // Run Java class with the jar in /app/
            cheerpjRunMain("TrafficAnalyzerGUI", "/app/TrafficSimulator.jar");
        });
    </script>
</body>
</html>
